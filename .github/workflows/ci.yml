name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  attacks:
    name: Attack scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.txt
      - name: Tests (guard rules, scenarios, model agent, containment)
        run: python -m pytest -v -p no:cacheprovider
      - name: Scenario report (every attack must work unguarded and be blocked guarded)
        run: |
          python -m agent_guardrails.report > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md

  mutation:
    name: Mutation check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.txt
      - name: Weaken each guard rule in turn; the tests must catch every one
        run: python mutation_check.py
